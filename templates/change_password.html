{% extends "base.html" %}
{% load static %}

{% block title %}BrightPath - Change Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5" data-aos="fade-up">
            <div class="glass-card p-4">
                <h4 class="text-gradient fw-bold mb-3"><i class="fas fa-key me-2"></i>Change Password</h4>
                <p class="text-muted small mb-4">Input your current password and specify a new password to secure your account.</p>
                
                <form method="POST" action="{% url 'change_password' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label text-white-50 small">Current Password:</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-white-50 small">New Password:</label>
                        <input type="password" name="new_password" class="form-control" minlength="6" required>
                    </div>
                    
                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a href="{% url 'profile' %}" class="btn btn-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
